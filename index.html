import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnrgaY8R0Zetkr18uHQJAZXIUa4EwDnv4",
  authDomain: "entrevista-inicial.firebaseapp.com",
  projectId: "entrevista-inicial",
  storageBucket: "entrevista-inicial.firebasestorage.app",
  messagingSenderId: "437375609844",
  appId: "1:437375609844:web:f3c04056dcbd58172e27a1",
  measurementId: "G-Y7EHRMMYDC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._db = db;

// Expose Firestore helpers globally
window.fsAddDoc = async (data) => {
  try {
    const docRef = await addDoc(collection(db, 'entrevistas'), data);
    return docRef.id;
  } catch(e){ console.error(e); return null; }
};
window.fsUpdateDoc = async (id, data) => {
  try { await updateDoc(doc(db, 'entrevistas', id), data); return true; }
  catch(e){ console.error(e); return false; }
};
window.fsDeleteDoc = async (id) => {
  try { await deleteDoc(doc(db, 'entrevistas', id)); return true; }
  catch(e){ console.error(e); return false; }
};
window.fsGetAll = async () => {
  try {
    const q = query(collection(db, 'entrevistas'), orderBy('savedAt','desc'));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({...d.data(), _firebaseId: d.id}));
  } catch(e){ console.error(e); return []; }
};
window._firebaseReady = true;
// Trigger load after firebase is ready
if(window._pendingLoad) window._pendingLoad();
</script>

function getDSMGroups(pid){
  if(pid==='pre'||pid==='escolar') return DSM_GROUPS.crianca;
  if(pid==='adol') return DSM_GROUPS.adol;
  if(pid==='adulto') return DSM_GROUPS.adulto;
  if(pid==='idoso') return DSM_GROUPS.idoso;
  return DSM_GROUPS.adulto;
}

function calcIdade(){
  const v=document.getElementById('dnasc').value;if(!v){document.getElementById('idade-badge').innerHTML='';return;}
  const n=new Date(v),h=new Date();let a=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))a--;
  document.getElementById('idade-badge').innerHTML=`<span class="age-badge">${a} anos</span>`;
}
function calcIdadeStr(d){
  const n=new Date(d),h=new Date();let a=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))a--;return a+' anos';
}

function buildObsScales(prefix,pid,savedObs){
  const scales=OBS_SCALES[pid]||[];
  if(!scales.length)return '';
  let html='';
  scales.forEach(s=>{
    const saved=savedObs&&savedObs[s.key]?savedObs[s.key]:null;
    html+=`<div class="obs-block"><div class="obs-block-title">${s.label}</div><div class="obs-scale">`;
    [{cls:'bom',lbl:'Bom',desc:s.bom},{cls:'medio',lbl:'Intermediário',desc:s.medio},{cls:'mau',lbl:'Comprometido',desc:s.mau}].forEach(o=>{
      const isSel=saved===o.cls;
      html+=`<div class="obs-opt${isSel?' sel-'+o.cls:''}" id="${prefix}os_${s.key}_${o.cls}" onclick="selObsScale('${s.key}','${o.cls}','${prefix}')"><div class="obs-opt-label">${o.lbl}</div><div class="obs-opt-desc">${o.desc}</div></div>`;
    });
    html+='</div></div>';
  });
  return html;
}

function selObsScale(key,cls,prefix){
  const store=prefix==='e_'?editObsResp:obsResp;
  const prev=store[key];
  if(prev){const el=document.getElementById(`${prefix}os_${key}_${prev}`);if(el)el.className='obs-opt';}
  if(prev===cls){delete store[key];return;}
  store[key]=cls;
  const el=document.getElementById(`${prefix}os_${key}_${cls}`);
  if(el)el.className=`obs-opt sel-${cls}`;
}

function buildClockTest(prefix,savedScore,savedPhoto){
  const p=prefix||'';
  const ph=savedPhoto||'';
  const sc=savedScore||null;
  const opts=[
    {cls:'ok',lbl:'Normal',desc:'Círculo bem traçado, números posicionados corretamente, ponteiros indicando o horário pedido.'},
    {cls:'parcial',lbl:'Alteração leve',desc:'Pequenos erros de posicionamento, números fora do lugar, ou ponteiros com leve imprecisão.'},
    {cls:'alt',lbl:'Alteração significativa',desc:'Números ausentes, desordem acentuada, incapacidade de marcar o horário, desenho desorganizado.'},
  ];
  let html=`<div class="clock-section">
    <p style="font-size:12px;color:#666;margin-bottom:10px">Instrução: <em>"Desenhe um relógio com todos os números e marque as <strong>11 horas e 10 minutos</strong>."</em></p>
    <div class="sec-title" style="margin-top:0">Classificação do desenho</div>
    <div class="clock-score-row">`;
  opts.forEach(o=>{
    const isSel=sc===o.cls;
    html+=`<div class="score-opt${isSel?' sel-'+o.cls:''}" id="${p}ck_${o.cls}" onclick="selClock('${o.cls}','${p}')"><div class="score-label">${o.lbl}</div><div class="score-desc">${o.desc}</div></div>`;
  });
  html+=`</div>
    <div class="sec-title">Foto do desenho do relógio</div>
    <input type="file" id="${p}clock-file" accept="image/*" capture="environment" onchange="loadClockPhoto(this,'${p}')">
    <div class="clock-photo-area" onclick="document.getElementById('${p}clock-file').click()">
      <img id="${p}clock-preview" class="clock-preview" src="${ph}" style="${ph?'display:block':'display:none'}">
      <div id="${p}clock-placeholder" style="${ph?'display:none':''}">
        <div class="clock-photo-icon">📸</div>
        <p>Toque para fotografar o desenho do relógio</p>
      </div>
    </div>
    <div class="lbl">Observações sobre o teste do relógio</div>
    <textarea id="${p}clock-obs" placeholder="Descreva o desempenho, comportamento durante a tarefa...">${''}</textarea>
  </div>`;
  return html;
}

function selClock(cls,p){
  ['ok','parcial','alt'].forEach(c=>{
    const el=document.getElementById(`${p}ck_${c}`);
    if(el)el.className='score-opt';
  });
  const el=document.getElementById(`${p}ck_${cls}`);
  if(el)el.className=`score-opt sel-${cls}`;
  if(p==='e_')editClockScore=cls;else clockScore=cls;
}

function loadClockPhoto(inp,p){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const url=e.target.result;
    if(p==='e_')editClockPhotoUrl=url;else clockPhotoUrl=url;
    const prev=document.getElementById(`${p}clock-preview`);
    const ph=document.getElementById(`${p}clock-placeholder`);
    if(prev){prev.src=url;prev.style.display='block';}
    if(ph)ph.style.display='none';
  };
  r.readAsDataURL(f);
}

function buildHipCard(prefix,pid,selArr,outrosArr){
  const p=prefix||'';
  const hasHip=selArr.length>0||outrosArr.length>0;
  // triagem: null = not answered, true = sim, false = nao
  const triagem=window[`${p}hipTriagem`]!==undefined?window[`${p}hipTriagem`]:null;
  const showDsm= triagem===true || hasHip;
  return `<div class="card" id="${p}hip-card">
    <div class="sec-title">Hipótese Diagnóstica Inicial — DSM-5</div>
    <p style="font-size:12px;color:#555;margin-bottom:12px">Existe hipótese diagnóstica a registrar nesta entrevista?</p>
    <div class="opts" style="margin-bottom:14px">
      <button class="opt${showDsm?' sel':''}" id="${p}hip-sim" onclick="setTriagem(true,'${p}')">Sim</button>
      <button class="opt${triagem===false?' sel':''}" id="${p}hip-nao" onclick="setTriagem(false,'${p}')">Não</button>
    </div>
    <div id="${p}hip-body" style="display:${showDsm?'block':'none'}">
      <div style="font-size:11px;color:#888;margin-bottom:10px">Transtornos organizados por área e faixa etária</div>
      ${buildDSM(prefix,pid,selArr,outrosArr)}
    </div>
  </div>`;
}

function setTriagem(val,p){
  window[`${p}hipTriagem`]=val;
  const sim=document.getElementById(`${p}hip-sim`);
  const nao=document.getElementById(`${p}hip-nao`);
  const body=document.getElementById(`${p}hip-body`);
  if(sim)sim.className=val?'opt sel':'opt';
  if(nao)nao.className=val?'opt':'opt sel';
  if(body)body.style.display=val?'block':'none';
  // if nao, clear selections
  if(!val){
    const arr=p==='e_'?editDsmSel:dsmSel;
    arr.length=0;
    renderOutros(p,[]);
    if(p==='e_')editDsmOutros.length=0;else dsmOutros.length=0;
    // uncheck all dsm visually
    document.querySelectorAll(`[id^="${p}dsm_"]`).forEach(el=>{
      el.classList.remove('checked');
      const cb=el.querySelector('input');if(cb)cb.checked=false;
    });
  }
}

function buildDSM(prefix,pid,selArr,outrosArr){
  const groups=getDSMGroups(pid);
  const p=prefix||'';
  let html='';
  groups.forEach((g,gi)=>{
    html+=`<div class="dsm-group"><div class="dsm-group-title">${g.grupo}</div><div class="dsm-grid">`;
    g.itens.forEach((d,ii)=>{
      const uid=`${p}dsm_${gi}_${ii}`;
      const chk=selArr.includes(d);
      html+=`<div class="dsm-check${chk?' checked':''}" id="${uid}" onclick="toggleDSM('${d}','${uid}','${p}')"><input type="checkbox"${chk?' checked':''} onclick="event.stopPropagation();toggleDSM('${d}','${uid}','${p}')"><label>${d}</label></div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<div class="dsm-outros-list" id="${p}dsm-ol">`;
  outrosArr.forEach((o,i)=>html+=`<span class="dsm-tag">${o}<button onclick="remOutro(${i},'${p}')">×</button></span>`);
  html+=`</div><div class="dsm-add-row"><input type="text" id="${p}dsm-ni" placeholder="Adicionar outro diagnóstico..."><button onclick="addOutro('${p}')">+ Adicionar</button></div>`;
  return html;
}

function toggleDSM(d,uid,p){
  const arr=p==='e_'?editDsmSel:dsmSel;const idx=arr.indexOf(d);
  const wrap=document.getElementById(uid);
  if(idx>=0){arr.splice(idx,1);if(wrap){wrap.classList.remove('checked');wrap.querySelector('input').checked=false;}}
  else{arr.push(d);if(wrap){wrap.classList.add('checked');wrap.querySelector('input').checked=true;}}
}
function addOutro(p){const inp=document.getElementById(`${p}dsm-ni`);const v=inp.value.trim();if(!v)return;const arr=p==='e_'?editDsmOutros:dsmOutros;arr.push(v);inp.value='';renderOutros(p,arr);}
function remOutro(i,p){const arr=p==='e_'?editDsmOutros:dsmOutros;arr.splice(i,1);renderOutros(p,arr);}
function renderOutros(p,arr){const el=document.getElementById(`${p}dsm-ol`);if(!el)return;el.innerHTML=arr.map((o,i)=>`<span class="dsm-tag">${o}<button onclick="remOutro(${i},'${p}')">×</button></span>`).join('');}

function buildForm(pid,resp,obsR,isEdit,dsmS,dsmO,cScore,cPhoto){
  const data=Q[pid];const pLabel=PROFILES.find(p=>p.id===pid).label.replace('\n',' ');
  const prefix=isEdit?'e_':'';
  let html=`<div class="card"><div class="sec-title">Observações do avaliador — ${pLabel}</div>`;
  html+=buildObsScales(prefix,pid,obsR);
  html+=`<div class="lbl" style="margin-top:14px">Notas adicionais</div><textarea id="${prefix}obs-nota" placeholder="Observações adicionais livres..."></textarea></div>`;
  html+=`<div class="card"><div class="sec-title">Questões objetivas</div>`;
  data.p.forEach((p,i)=>{
    html+=`<div class="qblock"><div class="qtxt">${i+1}. ${p.q}</div><div class="opts">`;
    p.o.forEach(o=>{const sel=resp[String(i)]===o?'sel':'';html+=`<button class="opt ${sel}" data-q="${i}" onclick="selOpt(this,'${o}','${prefix}')">${o}</button>`;});
    html+='</div></div>';
  });
  html+=`<div class="lbl" style="margin-top:10px">Observações gerais</div><textarea id="${prefix}obs-geral" placeholder="Observações gerais..."></textarea></div>`;
  if(pid==='idoso'){
    html+=`<div class="card"><div class="sec-title">Teste do Relógio</div>${buildClockTest(prefix,cScore,cPhoto)}</div>`;
  }
  html+=buildHipCard(prefix,pid,dsmS||[],dsmO||[]);

  return html;
}

async function salvarRegistro(){
  const nome=document.getElementById('nome').value||'—';const ex=coletarExtra('');
  const reg={nome,responsavel:document.getElementById('responsavel').value||'',dnasc:document.getElementById('dnasc').value||'',dataEnt:document.getElementById('data-ent').value||'',perfil,respostas:{...respostas},obsResp:{...obsResp},obsGeral:ex.obsGeral,obsNota:ex.obsNota,clockScore:clockScore||null,clockPhotoUrl:clockPhotoUrl||'',clockObs:ex.clockObs,dsmSel:[...dsmSel],dsmOutros:[...dsmOutros],savedAt:new Date().toISOString()};
  const btn=document.querySelector('#s-form .btn-sec:last-child');if(btn)btn.textContent='Salvando...';
  const id = await window.fsAddDoc(reg);
  if(id){ reg._firebaseId=id; registros.unshift(reg); alert(`Entrevista de "${nome}" salva!`); }
  else alert('Erro ao salvar. Verifique a conexão.');

function renderHist(){
  const el=document.getElementById('hist-lista');
  if(!registros.length){el.innerHTML='<div class="empty-state">Nenhuma entrevista realizada ainda.</div>';return;}
  el.innerHTML=registros.map((r,i)=>{
    const pl=PROFILES.find(p=>p.id===r.perfil)?.label.replace('\n',' ')||r.perfil;
    const ib=r.dnasc?calcIdadeStr(r.dnasc):'';
    const dc=(r.dsmSel||[]).length+(r.dsmOutros||[]).length;
    return `<div class="hist-item"><div class="hist-top"><div><div class="hist-nome">${r.nome}</div><div class="hist-info">${r.dataEnt||''}${ib?' · '+ib:''} · ${r.savedAt}${dc?' · '+dc+' hipótese(s)':''}</div></div><span class="hist-badge">${pl}</span></div><div class="hist-actions"><button class="btn-edit" onclick="editarReg(${i})">Editar</button><button class="btn-pdf" style="padding:6px 14px;font-size:12px" onclick="gerarPDFIdx(${i})">PDF</button><button class="btn-del" onclick="delReg(${i})">Excluir</button></div></div>`;
  }).join('');
}
function editarReg(i){
  editIdx=i;const r=registros[i];
  editRespostas={...r.respostas};editObsResp=JSON.parse(JSON.stringify(r.obsResp||{}));
  editDsmSel=[...(r.dsmSel||[])];editDsmOutros=[...(r.dsmOutros||[])];
  editClockScore=r.clockScore||null;editClockPhotoUrl=r.clockPhotoUrl||'';
  let html=`<div class="card"><div class="sec-title">Editando: ${r.nome}</div>
    <div class="field"><div class="lbl">Nome completo</div><input type="text" id="e_nome" value="${r.nome}"></div>
    <div class="field"><div class="lbl">Responsável</div><input type="text" id="e_resp" value="${r.responsavel||''}"></div>
    <div class="row2"><div class="field"><div class="lbl">Data de nascimento</div><input type="date" id="e_dnasc" value="${r.dnasc||''}"></div>
    <div class="field"><div class="lbl">Data da entrevista</div><input type="date" id="e_dataEnt" value="${r.dataEnt||''}"></div></div></div>`;
  html+=buildForm(r.perfil,editRespostas,editObsResp,true,editDsmSel,editDsmOutros,editClockScore,editClockPhotoUrl);
  // restore obs/geral after render
  document.getElementById('edit-content').innerHTML=html;
  setTimeout(()=>{
    const og=document.getElementById('e_obs-geral');if(og)og.value=r.obsGeral||'';
    const on=document.getElementById('e_obs-nota');if(on)on.value=r.obsNota||'';
    const co=document.getElementById('e_clock-obs');if(co)co.value=r.clockObs||'';
  },50);
  show('s-edicao');document.querySelectorAll('.htab').forEach(t=>t.classList.remove('active'));
}
async function salvarEdicao(){
  if(editIdx===null)return;const r=registros[editIdx];const ex=coletarExtra('e_');
  const updated={...r,nome:document.getElementById('e_nome')?.value||r.nome,responsavel:document.getElementById('e_resp')?.value||'',dnasc:document.getElementById('e_dnasc')?.value||'',dataEnt:document.getElementById('e_dataEnt')?.value||'',respostas:{...editRespostas},obsResp:{...editObsResp},obsGeral:ex.obsGeral,obsNota:ex.obsNota,clockScore:editClockScore,clockPhotoUrl:editClockPhotoUrl,clockObs:ex.clockObs,dsmSel:[...editDsmSel],dsmOutros:[...editDsmOutros],savedAt:new Date().toISOString()};
  if(r._firebaseId){ const ok=await window.fsUpdateDoc(r._firebaseId,updated); if(!ok){alert('Erro ao salvar.');return;} }
  registros[editIdx]=updated;
  alert('Alterações salvas!');switchTab('historico');
}
async function delReg(i){
  if(!confirm(`Excluir entrevista de "${registros[i].nome}"?`))return;
  const r=registros[i];
  if(r._firebaseId) await window.fsDeleteDoc(r._firebaseId);
  registros.splice(i,1);renderHist();
}

const NL={bom:'Bom',medio:'Intermediário',mau:'Comprometido'};
const CL={ok:'Normal',parcial:'Alteração leve',alt:'Alteração significativa'};
const CLR={bom:[22,163,74],medio:[217,119,6],mau:[220,38,38],ok:[22,163,74],parcial:[217,119,6],alt:[220,38,38]};

function buildPDF(reg){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const data=Q[reg.perfil];const pl=PROFILES.find(p=>p.id===reg.perfil)?.label.replace('\n',' ')||reg.perfil;
  const ib=reg.dnasc?calcIdadeStr(reg.dnasc):'';
  let y=15;
  doc.setFillColor(123,0,196);doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont('helvetica','italic');doc.text('Lucia Kratz',15,14);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('Entrevista Clínica Inicial · CRP 09/20590 · Goiânia-GO',15,22);
  y=40;
  doc.setTextColor(40,40,40);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('Dados do Paciente',15,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text(`Nome: ${reg.nome}`,15,y);y+=5;
  if(reg.responsavel)doc.text(`Responsável: ${reg.responsavel}`,15,y),y+=5;
  doc.text(`Nasc.: ${reg.dnasc||'—'}  ${ib}   Entrevista: ${reg.dataEnt||'—'}   Perfil: ${pl}`,15,y);y+=8;
  doc.setDrawColor(220,200,240);doc.line(15,y,195,y);y+=7;

  const scales=OBS_SCALES[reg.perfil]||[];
  if(scales.length){
    if(y>260){doc.addPage();y=15;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(123,0,196);doc.text('Observações do Avaliador',15,y);y+=6;
    scales.forEach(s=>{
      const nivel=reg.obsResp&&reg.obsResp[s.key];
      if(y>265){doc.addPage();y=15;}
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(50,50,50);doc.text(`${s.label}:`,15,y);
      if(nivel){
        const color=CLR[nivel]||[80,80,80];
        doc.setTextColor(...color);doc.text(`[${NL[nivel]}]`,195,y,'right');
        doc.setTextColor(80,80,80);doc.setFont('helvetica','normal');
        const lines=doc.splitTextToSize(s[nivel]||'',170);y+=5;doc.text(lines,18,y);y+=lines.length*4.5+2;
      } else {doc.setTextColor(150,150,150);doc.setFont('helvetica','normal');doc.text('Não avaliado',195,y,'right');y+=6;}
    });
    if(reg.obsNota){const lines=doc.splitTextToSize(`Notas: ${reg.obsNota}`,175);if(y+lines.length*5>275){doc.addPage();y=15;}doc.setTextColor(50,50,50);doc.setFontSize(9);doc.text(lines,15,y);y+=lines.length*5+2;}
    y+=4;
  }

  if(y>265){doc.addPage();y=15;}
  doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(123,0,196);doc.text('Questões Objetivas',15,y);y+=6;
  doc.setTextColor(50,50,50);
  data.p.forEach((p,i)=>{
    const rv=reg.respostas[String(i)]||'—';const lines=doc.splitTextToSize(`${i+1}. ${p.q}`,155);
    if(y+lines.length*5+2>275){doc.addPage();y=15;}
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(lines,15,y);
    doc.setFont('helvetica','bold');doc.setTextColor(123,0,196);doc.text(`[${rv}]`,195,y,'right');
    doc.setFont('helvetica','normal');doc.setTextColor(50,50,50);y+=lines.length*5+3;
  });
  if(reg.obsGeral){const lines=doc.splitTextToSize(`Obs.: ${reg.obsGeral}`,175);if(y+lines.length*5>275){doc.addPage();y=15;}doc.setFontSize(9);doc.text(lines,15,y);y+=lines.length*5+4;}

  // Clock test
  if(reg.perfil==='idoso'){
    if(y+10>265){doc.addPage();y=15;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(123,0,196);doc.text('Teste do Relógio',15,y);y+=6;
    if(reg.clockScore){
      const color=CLR[reg.clockScore]||[80,80,80];
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(50,50,50);doc.text('Resultado:',15,y);
      doc.setTextColor(...color);doc.text(`[${CL[reg.clockScore]}]`,195,y,'right');
      doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);y+=5;
    }
    if(reg.clockObs){const lines=doc.splitTextToSize(`Obs.: ${reg.clockObs}`,175);if(y+lines.length*5>275){doc.addPage();y=15;}doc.setFontSize(9);doc.setTextColor(50,50,50);doc.text(lines,15,y);y+=lines.length*5+3;}
    if(reg.clockPhotoUrl){
      if(y+65>275){doc.addPage();y=15;}
      try{doc.addImage(reg.clockPhotoUrl,'JPEG',15,y,80,60);}catch(e){try{doc.addImage(reg.clockPhotoUrl,'PNG',15,y,80,60);}catch(e2){}}
      y+=65;
    }
    y+=4;
  }

  const todos=[...(reg.dsmSel||[]),...(reg.dsmOutros||[])];
  if(todos.length){
    if(y+10>265){doc.addPage();y=15;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(123,0,196);doc.text('Hipótese Diagnóstica — DSM-5',15,y);y+=6;
    doc.setTextColor(50,50,50);doc.setFont('helvetica','normal');doc.setFontSize(9);
    todos.forEach(h=>{if(y>275){doc.addPage();y=15;}doc.text(`• ${h}`,15,y);y+=5;});
  }
  const pg=doc.getNumberOfPages();
  for(let i=1;i<=pg;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(180,180,180);doc.text(`Lucia Kratz · CRP 09/20590 · Página ${i} de ${pg}`,105,290,'center');}
  return{doc,nome:reg.nome,data:reg.dataEnt};
}
function gerarPDF(){
  const nome=document.getElementById('nome').value||'paciente';const ex=coletarExtra('');
  const reg={nome,responsavel:document.getElementById('responsavel').value||'',dnasc:document.getElementById('dnasc').value||'',dataEnt:document.getElementById('data-ent').value||'',perfil,respostas:{...respostas},obsResp:{...obsResp},obsGeral:ex.obsGeral,obsNota:ex.obsNota,clockScore,clockPhotoUrl,clockObs:ex.clockObs,dsmSel:[...dsmSel],dsmOutros:[...dsmOutros]};
  const{doc,data}=buildPDF(reg);doc.save(`entrevista_${nome.replace(/\s+/g,'_')}_${data}.pdf`);
}
function gerarPDFIdx(i){const{doc,nome,data}=buildPDF(registros[i]);doc.save(`entrevista_${nome.replace(/\s+/g,'_')}_${data}.pdf`);}
function gerarPDFEdicao(){
  if(editIdx===null)return;const r=registros[editIdx];const ex=coletarExtra('e_');
  const reg={...r,nome:document.getElementById('e_nome')?.value||r.nome,responsavel:document.getElementById('e_resp')?.value||'',dnasc:document.getElementById('e_dnasc')?.value||'',dataEnt:document.getElementById('e_dataEnt')?.value||'',respostas:{...editRespostas},obsResp:{...editObsResp},obsGeral:ex.obsGeral,obsNota:ex.obsNota,clockScore:editClockScore,clockPhotoUrl:editClockPhotoUrl,clockObs:ex.clockObs,dsmSel:[...editDsmSel],dsmOutros:[...editDsmOutros]};
  const{doc,nome,data}=buildPDF(reg);doc.save(`entrevista_${nome.replace(/\s+/g,'_')}_${data}.pdf`);
}
</script>
